// ─── STATE ─────────────────────────────────────────────────────────────────
let activeTab='map', activeFilter='all';

function findNode(id){return NODES.find(n=>n.id===id);}

function arcPath(from,to,curved){
  if(!curved){
    const mx=from.x+.5*(to.x-from.x), my=from.y+.5*(to.y-from.y)-.06*Math.abs(to.x-from.x);
    return `M ${from.x} ${from.y} Q ${mx} ${my} ${to.x} ${to.y}`;
  }
  const dx=to.x-from.x,dy=to.y-from.y,r=.72*Math.sqrt(dx*dx+dy*dy);
  return `M ${from.x} ${from.y} A ${r} ${r} 0 0 0 ${to.x} ${to.y}`;
}

function getNodeOpacity(node){
  if(activeFilter==='all') return 1;
  if(activeFilter===node.state||activeFilter===node.typo||activeFilter===node.group) return 1;
  if(Object.keys(ES).includes(activeFilter)){
    const vis=new Set();
    EDGES.forEach(e=>{if(e.state===activeFilter){vis.add(e.from);vis.add(e.to);}});
    return vis.has(node.id)?.45:.07;
  }
  return .07;
}
function getEdgeOpacity(edge){
  if(activeFilter==='all') return .82;
  if(activeFilter===edge.state||activeFilter===edge.typo) return 1;
  if(Object.keys(ES).includes(activeFilter)) return .05;
  const fn=findNode(edge.from),tn=findNode(edge.to);
  if(fn&&tn&&getNodeOpacity(fn)>=.4&&getNodeOpacity(tn)>=.4) return .45;
  return .05;
}

// ─── DOM HELPERS ──────────────────────────────────────────────────────────
function mkGroup(label){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;gap:4px;';
  const lbl=document.createElement('div');
  lbl.style.cssText='font-size:8px;font-weight:900;letter-spacing:.16em;color:#9fa2a4;text-transform:uppercase;';
  lbl.textContent=label;
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:4px;flex-wrap:wrap;';
  wrap.appendChild(lbl);
  wrap.appendChild(row);
  return {el:wrap, add:(child)=>row.appendChild(child)};
}
function mkBtn(label,active){
  const b=document.createElement('button');
  b.style.cssText=`padding:4px 10px;border:1.5px solid ${active?'#555':'#e8e8e8'};background:${active?'#e8e8e8':'#fff'};font-family:Montserrat,sans-serif;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:${active?'#333':'#9fa2a4'};transition:all .15s;cursor:pointer;`;
  b.textContent=label;
  return b;
}
function mkDiv(){
  const d=document.createElement('div');
  d.style.cssText='width:1px;background:#e8e8e8;align-self:stretch;';
  return d;
}

        <div style="font-size:9px;font-weight:700;opacity:.65;margin-top:2px">Components viable · Relationships broken</div>
      </div>

  // ── TABS

  [['map','System Map'],['mandate','Shift Mandate'],['payload','Phase III Payload']].forEach(([id,label])=>{

  Object.entries(GROUPS).forEach(([k,v])=>{

  // Group zones

// ─── CALLOUT ───────────────────────────────────────────────────────────────
function showCallout(ins,state,typo,title,sub){
  const co=document.getElementById('callout');
  if(!co) return;
  const ns=NS[state]||{};
  const esObj=ES[state];
  const isEdge=!!esObj&&!ns.fill;
  const color=isEdge?esObj.stroke:(ns.stroke||RED);
  const stateLabel=isEdge?esObj.label:(ns.label||state);
  const ty=TY[typo]||TY.unchanged;

  co.style.cssText=`display:block;position:absolute;width:326px;z-index:200;background:#fff;border:2px solid ${color};box-shadow:6px 6px 0 ${color}33;font-family:Montserrat,sans-serif;animation:calloutIn .16s ease;`;
  co.innerHTML=`
    <div style="background:${color};padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:19px;color:#fff;line-height:1;letter-spacing:.05em">${title}</div>
        ${sub?`<div style="font-size:9px;color:rgba(255,255,255,.72);margin-top:2px;font-weight:700;letter-spacing:.07em;text-transform:uppercase">${sub}</div>`:''}
      </div>
      <button onclick="closeCallout()" style="background:none;border:none;color:#fff;font-size:17px;line-height:1;padding:0 2px;margin-left:8px;opacity:.8;cursor:pointer">×</button>
    </div>
    <div style="display:flex;gap:6px;padding:7px 12px;border-bottom:1px solid #e8e8e8;background:#f8f7f6">
      <span style="font-size:9px;font-weight:800;letter-spacing:.09em;padding:3px 8px;background:${ns.fill||'#fff'};border:1.5px solid ${color};color:${color};text-transform:uppercase">${stateLabel}</span>
      <span style="font-size:9px;font-weight:800;letter-spacing:.09em;padding:3px 8px;background:${ty.bg};border:1.5px solid ${ty.border};color:${ty.text};text-transform:uppercase">${ty.label}</span>
    </div>
    <div style="padding:12px 14px">
      <div style="font-size:10.5px;font-weight:800;color:${color};margin-bottom:6px;line-height:1.3;text-transform:uppercase;letter-spacing:.02em">${ins.headline}</div>
      <div style="font-size:11.5px;color:#444;line-height:1.65;margin-bottom:10px;font-weight:500">${ins.body}</div>
      <div style="padding:8px 10px;background:${color}12;border-left:3px solid ${color};font-size:11px;color:${color};line-height:1.5;font-weight:700;font-style:italic">${ins.implication}</div>
    </div>`;
  return co;
}

function positionCallout(co,posX,posY){
  const mapWrap=document.getElementById('mapWrap');
  if(!mapWrap||!co) return;
  const cw=mapWrap.clientWidth;
  const left=posX+326+32>cw?Math.max(8,posX-326-12):posX+12;
  co.style.left=left+'px';
  co.style.top=Math.max(8,posY-36)+'px';
}

function closeCallout(){
  const co=document.getElementById('callout');
  if(co) co.style.display='none';
}
window.closeCallout=closeCallout;

// ─── MAP EVENTS ────────────────────────────────────────────────────────────
function attachMapEvents(){
  const svg=document.getElementById('mapSvg');
  const mapWrap=document.getElementById('mapWrap');
  if(!svg||!mapWrap) return;

  document.querySelectorAll('.ng').forEach(g=>{
    g.addEventListener('click',ev=>{
      ev.stopPropagation();
      const node=NODES.find(n=>n.id===g.dataset.nodeId);
      if(!node) return;
      const rect=g.querySelector('.nr').getBoundingClientRect();
      const wrap=mapWrap.getBoundingClientRect();
      const co=showCallout(node.ins,node.state,node.typo,node.label,node.sub);
      positionCallout(co,rect.left-wrap.left+rect.width/2,rect.top-wrap.top);
    });
    g.addEventListener('mouseenter',()=>{const r=g.querySelector('.nr');if(r)r.style.filter='brightness(.93)';});
    g.addEventListener('mouseleave',()=>{const r=g.querySelector('.nr');if(r)r.style.filter='';});
  });

  document.querySelectorAll('.eg').forEach(g=>{
    g.addEventListener('click',ev=>{
      ev.stopPropagation();
      const [fid,tid]=g.dataset.edgeKey.split('-');
      const edge=EDGES.find(e=>e.from===fid&&e.to===tid);
      const fn=findNode(fid),tn=findNode(tid);
      if(!edge||!fn||!tn) return;
      const path=g.querySelector('.ep');
      const rect=path.getBoundingClientRect();
      const wrap=mapWrap.getBoundingClientRect();
      const co=showCallout(edge.ins,edge.state,edge.typo,`${fn.label} → ${tn.label}`,edge.label);
      positionCallout(co,rect.left-wrap.left+rect.width/2,rect.top-wrap.top);
    });
    g.addEventListener('mouseenter',()=>{const p=g.querySelector('.ep');if(p)p.style.strokeWidth='2.5px';});
    g.addEventListener('mouseleave',()=>{const p=g.querySelector('.ep');if(p)p.style.strokeWidth='1.5px';});
  });

  svg.addEventListener('click',ev=>{if(ev.target===svg||ev.target.tagName==='svg')closeCallout();});
}
