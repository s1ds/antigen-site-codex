yer with no distinct positioning for the retention-stage consumer.",implication:"A positioning that doesn't speak to existing buyers cannot earn repeat. Trial converts to loyalty when the brand's promise at purchase matches the brand's promise at experience."}},{id:"D",label:"Distinctive",sub:"Assets",group:"brand",state:"stressed",typo:"unchanged",x:648,y:88,ins:{headline:"Present But Not Working Hard Enough",body:"Distinctive Brand Assets — colour, shape, logo, sonic cues — are the sensory shortcuts that allow a brand to be recognised in fragmented media. The brand has assets but they are not deployed with sufficient consistency to build mental availability needed to counter private label.",implication:"When media investment is fragmented, only brands with highly distinctive, consistently deployed assets maintain mental availability. Inconsistency makes assets invisible."}},{id:"E",label:"Media",sub:"Investment ⚠",group:"investment",state:"failing",typo:"changed",x:460,y:215,ins:{headline:"THE FAILING NODE — Spend Is High, Mental Availability Is Falling",body:"Media Investment is under attack from two directions: attention fragmentation is reducing the mental availability return per £ spent, and the J→E feedback loop that should redirect spend is not functioning strategically. The brand is spending more to achieve less.",implication:"Media investment is currently optimised for reach and trial. It is structurally misaligned with the brand's actual growth problem, which is repeat, not trial."}},{id:"F",label:"Retail",sub:"Media",group:"investment",state:"stressed",typo:"changing",x:648,y:215,ins:{headline:"Paying the Retailer to Reach the Buyer the Retailer Already Owns",body:"Retail Media spend primarily converts buyers who are already in-category — it does not build mental availability or emotional connection. For a brand struggling with repeat, retail media amplifies the trial problem without addressing the loyalty problem.",implication:"Retail media is a tax on distribution. Overindexing here accelerates trial without building the brand memory that creates repeat."}},{id:"G",label:"Distribution",sub:"",group:"distribution",state:"stressed",typo:"changing",x:178,y:215,ins:{headline:"Retailer Power Tightening the Shelf",body:"Distribution is under structural pressure from Retailer Power. As retailers expand private label ranges, they have a direct financial incentive to reduce branded SKU depth and shelf prominence. Distribution quality — shelf position, facings, activation — is deteriorating.",implication:"Distribution quality matters more than distribution breadth for a brand trying to convert trial to repeat. A buyer who can't find the brand on a second visit doesn't repeat."}},{id:"H",label:"Physical",sub:"Availability",group:"distribution",state:"stressed",typo:"unchanged",x:178,y:330,ins:{headline:"The Precondition for Everything Downstream — Being Eroded",body:"Physical Availability is the probability that a buyer can find and purchase the brand when motivated to do so. Retailer Power erodes this directly through delisting, range rationalisation, and shelf position decisions.",implication:"A consumer who wants to repeat but cannot find the product defaults to the nearest alternative — most often private label. This is the most invisible and most underreported loyalty killer."}},{id:"I",label:"Trial",sub:"",group:"growth",state:"healthy",typo:"unchanged",x:335,y:330,ins:{headline:"Trial Is Working — This Is Not the Problem",body:"Trial is being generated. Media investment, retail media, and physical availability are all contributing to first purchase. The brand is successfully acquiring new buyers. The problem is not that trial is low — it's that trial is not converting to repeat.",implication:"Every £ spent driving incremental trial while repeat is broken is a £ spent creating a one-time buyer. The acquisition cost is never recovered."}},{id:"J",label:"Penetration",sub:"⚠",group:"growth",state:"failing",typo:"changed",x:510,y:330,ins:{headline:"Growing Buyers, Losing Them Just as Fast",body:"Penetration is being squeezed from both sides: private label is cannibalising category share while the repeat mechanism is not retaining the buyers the brand does acquire. Penetration looks stable but masks dangerous churn.",implication:"Stable penetration with broken repeat means the brand is on a buyer treadmill — running hard to stay in place. This is a structurally expensive growth model that becomes fatal when acquisition costs rise."}},{id:"K",label:"Repeat",sub:"Purchase ⚠",group:"growth",state:"failing",typo:"changed",x:695,y:330,ins:{headline:"THE PRIMARY FAILING NODE — The Loyalty Mechanism Is Broken",body:"Repeat Purchase is the brand's core growth problem. Buyers are trialling but not returning. The K→C feedback loop is broken — repeat behaviour is not informing or sharpening the positioning. The brand is not learning from its existing loyal buyers.",implication:"Loyalty is not a marketing programme. It is a system property. When positioning, media, availability, and experience are aligned to the repeat buyer's need state, loyalty emerges. When they are not, churn is the default."}},{id:"L",label:"Revenue",sub:"",group:"growth",state:"stressed",typo:"changing",x:868,y:330,ins:{headline:"Revenue Under Pressure Despite Stable Volume",body:"Revenue is being squeezed by retailer margin pressure, private label share erosion, and increased media investment required to maintain penetration. The L→E reinvestment loop is functioning mechanically — but not fixing the underlying repeat problem.",implication:"Revenue reinvestment into media without fixing the loyalty mechanism creates a reinforcing loop of declining efficiency. Each cycle costs more and achieves less."}},{id:"M",label:"Attention",sub:"Fragmentation",group:"disruption",state:"disruption",typo:"changed",x:338,y:458,ins:{headline:"The Media Efficiency Destroyer",body:"Attention Fragmentation means the mental availability return per media £ is falling across the industry. Platform proliferation, second-screening, and algorithmic content feeds have collectively reduced the probability that any given media execution reaches a buyer in a receptive state.",implication:"The same media spend buys less attention than it did five years ago. Brands that haven't adapted to fragmented attention are experiencing media efficiency decline without understanding why."}},{id:"N",label:"Retailer",sub:"Power",group:"disruption",state:"disruption",typo:"changing",x:120,y:458,ins:{headline:"The Distribution Architecture Is Shifting",body:"Retailer Power is structurally increasing as grocery consolidation continues and retailers build first-party data and media capabilities. The balance of power between brand and retailer has shifted permanently.",implication:"A brand that cedes mental availability to retailers loses the ability to command premium pricing and resist private label substitution. The only defence is a brand strong enough that consumers specifically request it."}},{id:"O",label:"Private",sub:"Labels",group:"disruption",state:"disruption",typo:"changed",x:596,y:458,ins:{headline:"The Direct Competitor at the Repeat Occasion",body:"Private Label has improved dramatically in quality, packaging, and positioning. It is most dangerous at the repeat occasion, where a buyer with a positive trial experience but weak brand connection will trade down at the second purchase.",implication:"Private label wins by being good enough at a lower price. The only brand defence is being emotionally necessary — not just functionally adequate."}}],c=[{from:"A",to:"B",label:"activates",state:"active",typo:"unchanged",ins:{headline:"Needs Activate Entry Points",body:"Consumer Need States activate Category Entry Points — the mental situations that bring a buyer into category consideration. If the brand doesn't understand the need states driving category entry, it cannot own the entry points.",implication:"Most brands know their functional entry points. Few understand the emotional need states that make those entry points salient."}},{from:"B",to:"C",label:"frames",state:"distorted",typo:"changing",ins:{headline:"Entry Points Framing the Wrong Positioning",body:"Category Entry Points should frame and constrain Brand Positioning. This connection is distorted: as CEPs are eroded by retailer and platform mediation, the brand's positioning is drifting from the entry points that actually drive trial.",implication:"A brand positioned at entry points it no longer owns is spending to reinforce mental associations that never convert to purchase."}},{from:"C",to:"D",label:"gives meaning to",state:"active",typo:"unchanged",ins:{headline:"Positioning Gives Assets Their Meaning",body:"Brand Positioning gives Distinctive Assets their semantic content. When positioning is strong, assets carry meaning. When positioning weakens, assets become decorative.",implication:"Assets deployed without strong positioning are just aesthetics. They build recognition without building preference."}},{from:"D",to:"E",label:"amplified by",state:"distorted",typo:"changing",ins:{headline:"Assets Amplified Inconsistently",body:"Distinctive Assets should be amplified consistently through Media Investment. Fragmented media architectures and agency roster complexity are producing asset inconsistency across channels.",implication:"Inconsistent asset deployment across channels reduces rather than builds distinctive memory structures."}},{from:"D",to:"F",label:"deployed in",state:"distorted",typo:"changing",ins:{headline:"Retail Media Not Deploying Assets Effectively",body:"Retail media formats prioritise keyword relevance over brand distinctiveness. Distinctive Assets deployed in Retail Media should reinforce brand recognition at point of purchase.",implication:"Retail media spend that doesn't reinforce distinctive assets is paid distribution, not brand investment."}},{from:"E",to:"I",label:"drives",state:"distorted",typo:"changed",ins:{headline:"Media Driving Trial — But Declining Efficiency",body:"Media Investment drives Trial — this connection is active but degrading. Attention fragmentation is reducing the conversion rate from media exposure to trial. The brand is spending more to achieve the same trial volume.",implication:"Efficient trial generation is a solved problem for this brand. Continuing to optimise media for trial while repeat is broken is strategic misallocation."}},{from:"F",to:"I",label:"converts",state:"active",typo:"unchanged",ins:{headline:"Retail Media Converting In-Category Buyers",body:"Retail Media converts buyers who are already in-category consideration. This connection is functioning — retail media is generating trial among buyers already shopping the category.",implication:"Retail media is efficient at converting warm buyers. It cannot substitute for the mental availability that drives cold-start trial or repeat intention."}},{from:"G",to:"H",label:"enables",state:"distorted",typo:"changing",ins:{headline:"Distribution Enabling Availability — Under Pressure",body:"Distribution enables Physical Availability — but retailer power is systematically degrading the quality of this connection. Breadth of distribution is maintained but depth is deteriorating.",implication:"A buyer who finds the brand on a smaller shelf with fewer SKU options is more likely to switch to a more visible alternative at repeat."}},{from:"H",to:"I",label:"enables",state:"active",typo:"unchanged",ins:{headline:"Availability Enabling Trial",body:"Physical Availability enables Trial — this connection is functioning. The brand is available and findable for first purchase. The availability problem manifests downstream, at the repeat occasion.",implication:"Availability at trial is necessary but not sufficient. Availability at repeat is the critical constraint."}},{from:"I",to:"J",label:"builds",state:"stressed",typo:"changing",ins:{headline:"Trial Building Penetration — Churn Masking the Weakness",body:"Trial builds Penetration — this connection is active but its output is masking a crisis. Penetration looks stable because new buyers are entering at roughly the same rate as existing buyers are churning.",implication:"Stable penetration is a vanity metric when repeat is broken. It means the brand is acquiring new buyers at the cost of losing old ones."}},{from:"J",to:"K",label:"should convert to",state:"missing",typo:"changed",ins:{headline:"THE CRITICAL MISSING CONVERSION",body:"Penetration should convert to Repeat Purchase — this is the core loyalty mechanism. This connection is structurally absent. Buyers are trialling, entering the penetration count, and then not returning.",implication:"Fixing this connection — understanding and removing the barriers between first and second purchase — is the highest-leverage intervention available to the brand."}},{from:"K",to:"L",label:"drives",state:"stressed",typo:"changing",ins:{headline:"Repeat Driving Revenue — Base Is Shrinking",body:"Repeat Purchase drives Revenue — this connection is functioning but weakening as the repeat buyer base shrinks. A smaller pool of loyalists is generating a larger proportion of revenue.",implication:"Revenue concentration among a shrinking loyal base is a leading indicator of future revenue decline."}},{from:"L",to:"E",label:"reinvests in",state:"distorted",typo:"unchanged",ins:{headline:"Revenue Reinvested in the Wrong Problem",body:"Revenue is being reinvested in Media Investment mechanically. But it is reinvesting in the wrong problem. Revenue from a shrinking loyal base is being spent on driving trial for a brand that cannot retain the buyers it acquires.",implication:"The reinvestment loop is reinforcing a failing strategy. Each cycle invests more in acquisition and recovers less revenue per buyer."}},{from:"K",to:"C",label:"should inform",state:"missing",typo:"changed",curved:!0,ins:{headline:"THE BROKEN FEEDBACK LOOP — Loyalty Not Informing Positioning",body:"This is the most strategically important broken connection in the system. Repeat Purchase behaviour should feed back into Brand Positioning — what do loyalists value? What need states are being satisfied by the second, third, fourth purchase? None of this is flowing back into positioning decisions.",implication:"The brand is positioned for the first-time buyer. Building this feedback loop — loyalty-informed positioning — is the structural intervention that makes repeat a system property, not a lucky outcome."}},{from:"J",to:"E",label:"should redirect",state:"distorted",typo:"changing",curved:!0,ins:{headline:"Penetration Data Should Redirect Media — It Isn't",body:"Penetration data should redirect Media Investment — when penetration is stable but repeat is broken, the signal should shift spend from acquisition media to retention media. This feedback exists mechanically but is not functioning strategically.",implication:"The media plan is being written from penetration data that looks healthy. It is not being written from repeat data that reveals the crisis."}},{from:"M",to:"E",label:"degrades ROI of",state:"disruption",typo:"changed",ins:{headline:"Attention Fragmentation Destroying Media Efficiency",body:"Attention Fragmentation directly degrades the return on Media Investment. The same spend buys less attention, less mental availability, and less trial conversion than it did five years ago.",implication:"Media efficiency recovery requires creative adaptation and channel strategy adaptation — not more spend."}},{from:"N",to:"G",label:"pressures",state:"disruption",typo:"changing",ins:{headline:"Retailer Power Tightening Distribution",body:"Retailer Power directly pressures Distribution quality. As retailers expand private label, they actively disadvantage brands that compete with their own-label ranges.",implication:"Distribution pressure from retailer power is not a negotiation problem. It is a brand strength problem."}},{from:"O",to:"J",label:"cannibalises",state:"disruption",typo:"changed",ins:{headline:"Private Label Intercepting the Repeat Buyer",body:"Private Label directly cannibalises Penetration by intercepting buyers at the repeat occasion. A buyer who trialled the branded product with a satisfactory but not exceptional experience is highly susceptible to private label substitution at second purchase.",implication:"Private label wins by being good enough at a lower price. The only brand defence is being emotionally necessary — not just functionally adequate."}}],f="#e31d28",d="#e3195b",p="#ffc000",h={healthy:{fill:"#eef7f2",stroke:"#2a9d5c",text:"#1a6e3c",label:"Healthy"},stressed:{fill:"#fff8e6",stroke:"#d4930a",text:"#7a5700",label:"Stressed"},failing:{fill:"#fde8e9",stroke:"#e31d28",text:"#b11226",label:"Failing"},misrouted:{fill:"#e6f4fb",stroke:"#08a7d8",text:"#065a7a",label:"Misrouted"},disruption:{fill:"#f3e8f9",stroke:"#8e44ad",text:"#5b2c6f",label:"Disruption"}},m={active:{stroke:"#aaaaaa",dash:"none",label:"Active"},distorted:{stroke:"#d4930a",dash:"6 3",label:"Distorted"},missing:{stroke:"#e31d28",dash:"7 4",label:"Missing"},disruption:{stroke:"#9B59B6",dash:"4 4",label:"Disruption"},feedback:{stroke:"#08a7d8",dash:"8 4",label:"Feedback"},stressed:{stroke:"#ffc000",dash:"none",label:"Stressed"}},g={unchanged:{bg:"#e8e8e8",text:"#6e6e6e",border:"#9fa2a4",label:"UNCHANGED",desc:"Nothing has changed"},changing:{bg:"#fff3cc",text:"#7a5700",border:"#d4930a",label:"CHANGING",desc:"Under pressure / in transition"},changed:{bg:"#fde8e9",text:"#b11226",border:"#e31d28",label:"CHANGED",desc:"Already fundamentally altered"}},y={brand:{label:"BRAND & POSITIONING",color:d},investment:{label:"INVESTMENT",color:"#08a7d8"},distribution:{label:"DISTRIBUTION",color:"#4A9E6B"},growth:{label:"GROWTH CHAIN",color:f},disruption:{label:"DISRUPTION OVERLAY",color:"#9B59B6"}};function b(e){return u.find(t=>t.id===e)}function v({d:e,onClose:t,cW:n}){let r=h[e.state],a=m[e.state],l=a?a.stroke:r?.stroke??f,o=a?a.label:r?.label??e.state,s=g[e.typo]
