  <script>const A='india-comparison-commerce-assets/';
const slides=[
{t:'red',chapter:'Opening',html:`<div class="cover-grid"><div class="cover-copy"><div class="kicker">Market Insights & Go-To-Market Strategy</div><h1 class="display title">India<br>Comparison<br>Commerce</h1><div class="rule"></div><p class="lead">The market is large. <span class="accent">The opportunity is uneven.</span></p></div><div class="cover-art"><div class="india-mark">IN</div></div></div><div class="meta">ANTIGEN / JUNE 2026 / CONFIDENTIAL</div>`},
{t:'black',chapter:'Executive Summary',title:'The verdict in one page',html:`<div class="grid-2"><div><div class="kicker">Executive Summary</div><h2 class="display slide-title">India is structurally attractive.<br><span class="red-text">But not every vertical is.</span></h2><p class="lead" style="margin-top:28px">The winning model pairs a traffic engine with a revenue engine, then compounds into travel, vernacular and ONDC.</p></div><div class="metric-grid"><div class="metric"><strong>1BN</strong><span>internet users</span></div><div class="metric"><strong>70%</strong><span>smartphone penetration</span></div><div class="metric"><strong>$163B</strong><span>2030 conservative commerce outlook</span></div><div class="metric"><strong>27%</strong><span>e-commerce CAGR</span></div></div></div>`},
{t:'paper',chapter:'Executive Summary',title:'The four questions',html:`<div class="kicker">The report answers</div><h2 class="display slide-title">Four questions.<br>Four decisive answers.</h2><div class="grid-4" style="margin-top:32px"><article class="open-card"><h3>Is India attractive?</h3><p><b>Yes.</b> But the opportunity is vertical-specific and infrastructure-aware.</p></article><article class="open-card"><h3>What comes first?</h3><p>Credit and loans for revenue. Electronics for traffic. Travel for scale.</p></article><article class="open-card"><h3>Where is the gap?</h3><p>Multidimensional comparison: price + seller + delivery + returns + BNPL.</p></article><article class="open-card"><h3>What wins?</h3><p>SEO-led, mobile-first and vernacular-enabled—with GEO built from day one.</p></article></div>`},
{t:'yellow',chapter:'Executive Summary',title:'Recommended entry',html:`<div class="signal"><h2 class="display">Traffic<br>× Revenue<br><span class="outline">= Leverage</span></h2><p class="note">Electronics brings the audience. Credit and loans monetise it. Each phase funds and feeds the next.</p></div>`},
{t:'red',chapter:'1. Market Context',title:'India market context',html:`<div class="divider-copy"><div class="kicker">Chapter 01</div><h2 class="display section-title">India is not simply large.<br><span class="outline">It is structurally ready.</span></h2><p class="lead">Demographic scale meets digital rails, but the market fragments sharply by geography, language and trust.</p></div><div class="chapter-no">01</div>`},
{t:'paper',chapter:'1. Market Context',title:'Demographic & economic landscape',html:`<div class="grid-2"><div><div class="kicker">1.1 + 1.2 / Demographic & Economic</div><h2 class="display slide-title">Young. Urbanising.<br>Still under-penetrated.</h2><p class="lead" style="margin-top:24px">A 1.44B population and a 28-year median age meet retail e-commerce penetration of just 18–19%.</p></div><div class="metric-grid"><div class="metric"><strong>600M+</strong><span>Gen Z + Millennial consumers</span></div><div class="metric"><strong>60%</strong><span>of new online shoppers come from Tier 2/3</span></div><div class="metric"><strong>6–7%</strong><span>annual GDP growth</span></div><div class="metric"><strong>57%</strong><span>private consumption share of GDP</span></div></div></div>`},
{t:'paper',chapter:'1. Market Context',title:'The Many Indias',html:`<div class="grid-2"><div><div class="kicker">1.3 / Geographic Landscape</div><h2 class="display slide-title">One country.<br><span class="red-text">Four markets.</span></h2><div class="grid-2" style="height:auto;margin-top:26px;gap:10px"><article class="open-card"><h3>Metro India</h3><p>High ARPU. English-comfortable. Brand-aware. Most competitive.</p></article><article class="open-card"><h3>Tier 2 India</h3><p>Fastest growth. Price-sensitive. Vernacular-first. The real engine.</p></article><article class="open-card"><h3>Tier 3 India</h3><p>Mobile-only. First-time buyers. COD and word-of-mouth matter.</p></article><article class="open-card"><h3>Rural Bharat</h3><p>Voice-first migration, agricultural income cycles, emerging smartphones.</p></article></div></div><div><figure class="figure contain"><img src="${A}many-indias.jpg" alt="Metro versus Bharat comparison chart from Digital Bharat Blueprint"></figure><div class="figure-caption">Source visual: The Digital Bharat Blueprint</div></div></div>`},
{t:'black',chapter:'1. Market Context',title:'Media & digital infrastructure',html:`<div class="kicker">1.4 / The enabling rails</div><h2 class="display slide-title">Comparison works because<br><span class="red-text">the friction is collapsing.</span></h2><div class="grid-3" style="margin-top:34px"><article class="open-card yellow-line"><h3>Smartphone + Data</h3><p>750M+ smartphone users. 70%+ of commerce transactions on mobile. Data at ₹10–15/GB.</p></article><article class="open-card yellow-line"><h3>Vernacular + Voice</h3><p>350M+ regional-language users. 27% of Indian Google searches voice-initiated.</p></article><article class="open-card yellow-line"><h3>UPI + ONDC + Stack</h3><p>UPI removes checkout anxiety. ONDC opens inventory. India Stack simplifies KYC.</p></article></div><blockquote class="quote" style="margin-top:34px">Infrastructure is not background context. It is the enabling condition.</blockquote>`},
{t:'red',chapter:'2. Commerce Landscape',title:'Digital commerce landscape',html:`<div class="divider-copy"><div class="kicker">Chapter 02</div><h2 class="display section-title">Five commerce models.<br><span class="outline">One comparison layer.</span></h2><p class="lead">India's ecosystem is overlapping, fast-moving and structurally suited to cross-model aggregation.</p></div><div class="chapter-no">02</div>`},
{t:'paper',chapter:'2. Commerce Landscape',title:'Market size & trajectory',html:`<div class="grid-2"><div><div class="kicker">2.1 / Market trajectory</div><h2 class="display slide-title">The headroom<br>is the story.</h2><p class="lead" style="margin-top:22px">India could move from roughly $70–80B in 2025 to $163–400B by 2030, depending on ONDC, quick commerce and Bharat adoption.</p></div><div class="bars"><div class="bar-row"><span>India today</span><div class="bar-track"><div class="bar-fill" style="width:20%"></div></div><b>$80B</b></div><div class="bar-row"><span>2030 conservative</span><div class="bar-track"><div class="bar-fill" style="width:41%"></div></div><b>$163B</b></div><div class="bar-row"><span>2030 upside</span><div class="bar-track"><div class="bar-fill" style="width:100%"></div></div><b>$400B</b></div><div class="rule"></div><p class="small"><b>Retail penetration:</b> India ~19% · US 22% · UK 38% · China 47%</p></div></div>`},
{t:'black',chapter:'2. Commerce Landscape',title:'Five models at once',html:`<div class="kicker">2.2 / Evolution of Commerce</div><h2 class="display slide-title">Comparison need changes<br>with the model.</h2><div class="grid-4" style="margin-top:28px"><article class="open-card yellow-line"><h3>Marketplace</h3><p>Amazon + Flipkart. Compare price, seller and reliability.</p></article><article class="open-card yellow-line"><h3>Quick Commerce</h3><p>Compare speed, stock and total landed cost.</p></article><article class="open-card yellow-line"><h3>Social Commerce</h3><p>Compare trust, proof and authenticity.</p></article><article class="open-card yellow-line"><h3>D2C</h3><p>Compare discovery, claims and reviews.</p></article></div><div class="open-card yellow-line" style="margin-top:1px;min-height:120px"><h3>ONDC Commerce</h3><p>Compare across an open seller network without bilateral merchant integration.</p></div>`},
{t:'paper',chapter:'2. Commerce Landscape',title:'Structural trends & risks',html:`<div class="grid-2"><div><div class="kicker">2.3 / Structural Trends</div><h2 class="display slide-title">Tailwinds</h2><div class="grid-2" style="height:auto;margin-top:24px;gap:8px"><article class="open-card"><h3>AI-assisted</h3><p>Review and spec summarisation.</p></article><article class="open-card"><h3>Social + live</h3><p>Influencer-led discovery.</p></article><article class="open-card"><h3>Voice</h3><p>Vernacular search at scale.</p></article><article class="open-card"><h3>Predictive</h3><p>Price alerts and auto-buy.</p></article></div></div><div><div class="kicker">2.4 / Industry Risks</div><h2 class="display slide-title">Headwinds</h2><div class="grid-2" style="height:auto;margin-top:24px;gap:8px"><article class="open-card"><h3>Regulation</h3><p>Rules and ONDC protocols evolve.</p></article><article class="open-card"><h3>Counterfeits</h3><p>Trust deficit contaminates reviews.</p></article><article class="open-card"><h3>Margin</h3><p>Affiliate rates sit outside your control.</p></article><article class="open-card"><h3>Concentration</h3><p>Amazon + Flipkart hold 65%+ GMV.</p></article></div></div></div>`},
{t:'red',chapter:'3. The Shopper',title:'The Indian digital shopper',html:`<div class="divider-copy"><div class="kicker">Chapter 03</div><h2 class="display section-title">Comparison intent<br><span class="outline">already exists.</span></h2><p class="lead">Price-elastic, platform-promiscuous and review-dependent: the shopper does not need persuasion, only interception.</p></div><div class="chapter-no">03</div>`},
{t:'paper',chapter:'3. The Shopper',title:'Shopper archetypes',html:`<div class="grid-2"><div><div class="kicker">3.1 / Shopper Archetypes</div><h2 class="display slide-title">Four shoppers.<br>Four forms of trust.</h2><div class="grid-2" style="height:auto;margin-top:24px;gap:8px"><article class="open-card"><h3>Gen Z Trend Hunter</h3><p>Social validation. 3–4 platforms. Switches for ₹100.</p></article><article class="open-card"><h3>Tier 2/3 Value Seeker</h3><p>Discount-led. Vernacular-first. COD-aware.</p></article><article class="open-card"><h3>Female Shopper</h3><p>Reviews, authenticity and return safety.</p></article><article class="open-card"><h3>45+ Trust Seeker</h3><p>Needs simplified choice, Hindi and visible proof.</p></article></div></div><div><figure class="figure contain"><img src="${A}shopper-archetypes.jpg" alt="Four shopper archetypes chart"></figure><div class="figure-caption">Source visual: India Digital Shopper Decision Journey</div></div></div>`},
{t:'black',chapter:'3. The Shopper',title:'Motivations hierarchy',html:`<div class="grid-2"><div><div class="kicker">3.2 / Motivations Hierarchy</div><h2 class="display slide-title">Price opens.<br><span class="red-text">Trust closes.</span></h2><p class="lead" style="margin-top:28px">Convenience now differentiates. Brand matters—but remains negotiable for most shoppers.</p></div><div class="bars"><div class="bar-row"><span>Price</span><div class="bar-track"><div class="bar-fill" style="width:100%"></div></div><b>01</b></div><div class="bar-row"><span>Trust</span><div class="bar-track"><div class="bar-fill" style="width:82%"></div></div><b>02</b></div><div class="bar-row"><span>Convenience</span><div class="bar-track"><div class="bar-fill" style="width:64%"></div></div><b>03</b></div><div class="bar-row"><span>Brand</span><div class="bar-track"><div class="bar-fill" style="width:40%"></div></div><b>04</b></div></div></div>`},
{t:'paper',chapter:'3. The Shopper',title:'Discovery & research',html:`<div class="kicker">3.3 + 3.4 / Discovery & Research</div><h2 class="display slide-title">Discovery fragments.<br>Research intensifies.</h2><div class="grid-3" style="margin-top:30px"><article class="open-card"><h3>55%+</h3><p>of purchase journeys begin with Google. Non-branded SEO remains the entry gate.</p></article><article class="open-card"><h3>78%</h3><p>read at least three reviews. Verified aggregation is a high-value layer.</p></article><article class="open-card"><h3>65%+</h3><p>of electronics buyers consult YouTube reviews before purchase.</p></article></div><blockquote class="quote" style="margin-top:30px">GEO is emerging beside SEO—not after it.</blockquote>`},
{t:'black',chapter:'3. The Shopper',title:'Purchase, loyalty & switching',html:`<div class="kicker">3.5 + 3.6 / Purchase, Loyalty & Switching</div><h2 class="display slide-title">The consumer is loyal<br><span class="red-text">to the best answer.</span></h2><div class="grid-3" style="margin-top:32px"><div class="metric"><strong>65%+</strong><span>online transactions through UPI</span></div><div class="metric"><strong>20–30%</strong><span>COD among newer Tier 2/3 buyers</span></div><div class="metric"><strong>3.4×</strong><span>platform touchpoints per purchase</span></div></div><p class="lead" style="margin-top:34px">Platform promiscuity is structural. Category, price and trust determine the destination.</p>`},
{t:'red',chapter:'4. Decision Journey',title:'The commerce decision journey',html:`<div class="divider-copy"><div class="kicker">Chapter 04</div><h2 class="display section-title">Enter earlier.<br><span class="outline">Stay later.</span></h2><p class="lead">The price-check moment is already served. The bigger opportunity surrounds it.</p></div><div class="chapter-no">04</div>`},
{t:'paper',chapter:'4. Decision Journey',title:'The loop',html:`<div class="grid-2"><div><div class="kicker">4.0 / Journey Overview</div><h2 class="display slide-title">The funnel<br>became a loop.</h2><p class="lead" style="margin-top:24px">Discovery, research, purchase and advocacy now feed one another continuously.</p></div><div><figure class="figure contain"><img src="${A}decision-loop.jpg" alt="Four-phase Indian digital shopper decision loop"></figure><div class="figure-caption">Source visual: India Digital Shopper Decision Journey</div></div></div>`},
{t:'paper',chapter:'4. Decision Journey',title:'Where value is created',html:`<div class="kicker">4.1–4.5 / The complete journey</div><h2 class="display slide-title">Five stages.<br>Two underbuilt layers.</h2><div class="journey"><article class="step"><b>01</b><h3>Discovery</h3><p>AI matching, short-form video, non-branded search.</p></article><article class="step"><b>02</b><h3>Research</h3><p>Visual search, vernacular content, summarised reviews.</p></article><article class="step" style="background:#fff0b8"><b>03</b><h3>Comparison</h3><p>Price + trust + delivery + returns + warranty + BNPL.</p></article><article class="step"><b>04</b><h3>Checkout</h3><p>UPI deep links, BNPL visibility, COD filtering.</p></article><article class="step" style="background:#fff0b8"><b>05</b><h3>Post-purchase</h3><p>Reviews, replenishment and seller-support intelligence.</p></article></div>`},
{t:'black',chapter:'4. Decision Journey',title:'The critical insertion point',html:`<div class="statement"><div class="kicker">4.3 / Comparison</div><h2 class="display">Price is a field.<br><span class="red-text">Trust is the product.</span></h2><p class="lead">No Indian platform yet unifies seller trust, delivery reliability, returns friction, warranty and BNPL availability in one comparison view.</p></div>`},
{t:'paper',chapter:'4. Decision Journey',title:'Purchase & post-purchase',html:`<div class="grid-2"><div><div class="kicker">4.4 / Purchase & Checkout</div><h2 class="display slide-title">Remove the final friction.</h2><div class="metric-grid" style="margin-top:24px"><div class="metric"><strong>UPI</strong><span>deep-link directly into partner checkout</span></div><div class="metric"><strong>BNPL</strong><span>surface merchant availability</span></div><div class="metric"><strong>COD</strong><span>treat as a first-class filter</span></div><div class="metric"><strong>2 SEC</strong><span>mobile load target</span></div></div></div><div><div class="kicker">4.5 / Post-Purchase</div><h2 class="display slide-title">Build the data flywheel.</h2><ul class="lead" style="font-size:16px;padding-left:20px;line-height:1.8"><li>Feed verified reviews back into comparison.</li><li>Compare replenishment at the moment of need.</li><li>Rank sellers by post-purchase support.</li></ul></div></div>`},
{t:'red',chapter:'5. Competitive Landscape',title:'Comparison & aggregation',html:`<div class="divider-copy"><div class="kicker">Chapter 05 / Centrepiece</div><h2 class="display section-title">Traffic is proven.<br><span class="outline">Profit is not.</span></h2><p class="lead">Who owns comparison behaviour—and where are the genuine gaps?</p></div><div class="chapter-no">05</div>`},
{t:'black',chapter:'5. Competitive Landscape',title:'Market overview',html:`<div class="grid-2"><div><div class="kicker">5.1 / Market Overview</div><h2 class="display slide-title">Large audiences.<br><span class="red-text">Thin models.</span></h2><p class="lead" style="margin-top:26px">Outside insurance and lending, no comparison player has cracked durable monetisation at scale.</p></div><div class="metric-grid"><div class="metric"><strong>40M+</strong><span>monthly electronics comparison visits</span></div><div class="metric"><strong>25M</strong><span>PolicyBazaar monthly visits</span></div><div class="metric"><strong>24M</strong><span>MakeMyTrip monthly visits</span></div><div class="metric"><strong>27%+</strong><span>YoY growth in comparison-intent search</span></div></div></div>`},
{t:'paper',chapter:'5. Competitive Landscape',title:'Platform-by-platform',html:`<div class="kicker">5.2 / Competitive Landscape</div><h2 class="display slide-title">Eight players.<br>No cross-category winner.</h2><table class="matrix" style="margin-top:24px"><thead><tr><th>Platform</th><th>Traffic</th><th>Strength</th><th>Weakness</th><th>Model</th></tr></thead><tbody><tr><td>MySmartPrice</td><td>~13M</td><td>Electronics + SEO depth</td><td>Narrow; thin commissions</td><td>Affiliate + ads</td></tr><tr><td>Smartprix</td><td>~11M</td><td>Phone comparison UX</td><td>Electronics only</td><td>Affiliate</td></tr><tr><td>Google Shopping</td><td>Embedded</td><td>Zero-friction reach</td><td>No loyalty</td><td>CPC</td></tr><tr><td>BuyHatke / CashKaro</td><td>Low–mid</td><td>History / cashback</td><td>Utility, not neutral layer</td><td>Affiliate</td></tr><tr><td>BankBazaar</td><td>~5M</td><td>Credit + loan SEO</td><td>Vertical locked</td><td>Lead-gen</td></tr><tr><td>Paisabazaar</td><td>~5M</td><td>Disbursal + credit score</td><td>Ecosystem dependence</td><td>Lead-gen</td></tr><tr><td>PolicyBazaar</td><td>~25M</td><td>93% insurance share</td><td>License + single vertical</td><td>Commission</td></tr></tbody></table>`},
{t:'paper',chapter:'5. Competitive Landscape',title:'Category coverage',html:`<div class="grid-2"><div><div class="kicker">5.3 / Category Coverage</div><h2 class="display slide-title">Coverage is wide.<br>Neutrality is rare.</h2><div class="bars" style="margin-top:28px"><div class="bar-row"><span>Electronics</span><div class="bar-track"><div class="bar-fill" style="width:94%"></div></div><b>HEAVY</b></div><div class="bar-row"><span>Finance</span><div class="bar-track"><div class="bar-fill" style="width:82%"></div></div><b>DEEP</b></div><div class="bar-row"><span>Travel</span><div class="bar-track"><div class="bar-fill" style="width:70%"></div></div><b>META</b></div><div class="bar-row"><span>Fashion / BPC</span><div class="bar-track"><div class="bar-fill" style="width:32%"></div></div><b>GAP</b></div><div class="bar-row"><span>Q-commerce</span><div class="bar-track"><div class="bar-fill" style="width:18%"></div></div><b>EARLY</b></div></div></div><div><figure class="figure contain"><img src="${A}market-map.jpg" alt="Indian digital commerce market map"></figure><div class="figure-caption">Source visual: India Digital Shopper Decision Journey</div></div></div>`},
{t:'black',chapter:'5. Competitive Landscape',title:'White space',html:`<div class="kicker">5.4 / White Space Analysis</div><h2 class="display slide-title">The moat is a layer.<br><span class="red-text">Not a vertical.</span></h2><div class="grid-3" style="margin-top:30px"><article class="open-card yellow-line"><h3>Multidimensional</h3><p>Price + seller + delivery + returns + warranty + BNPL.</p></article><article class="open-card yellow-line"><h3>Vernacular</h3><p>350M users without comparison depth in their language.</p></article><article class="open-card yellow-line"><h3>ONDC-native</h3><p>An open buyer-side layer with network-wide inventory.</p></article><article class="open-card yellow-line"><h3>AI summaries</h3><p>Review compression into reasons to buy—or walk away.</p></article><article class="open-card yellow-line"><h3>Q-commerce</h3><p>Real-time price and availability; monetisation still open.</p></article><article class="open-card yellow-line"><h3>Trust scores</h3><p>Seller verification aggregated across marketplaces.</p></article></div>`},
{t:'red',chapter:'6. Category Opportunity',title:'Category opportunity',html:`<div class="divider-copy"><div class="kicker">Chapter 06</div><h2 class="display section-title">Choose the stack.<br><span class="outline">Not the category.</span></h2><p class="lead">Demand, comparison need, monetisation and competition point to a compound portfolio.</p></div><div class="chapter-no">06</div>`},
{t:'paper',chapter:'6. Category Opportunity',title:'Category scorecard',html:`<div class="kicker">6.1–6.6 / Category Scorecard</div><h2 class="display slide-title">The stack that fits<br>the model.</h2><table class="matrix" style="margin-top:26px"><thead><tr><th>Category</th><th>Demand</th><th>Need</th><th>Monetisation</th><th>Competition</th><th>Total</th></tr></thead><tbody><tr class="winner"><td>Credit / Loans</td><td>4/5</td><td>5/5</td><td>5/5</td><td>3/5</td><td>17/20</td></tr><tr><td>Travel</td><td>5/5</td><td>4/5</td><td>4/5</td><td>2/5</td><td>15/20</td></tr><tr><td>Electronics</td><td>5/5</td><td>5/5</td><td>2/5</td><td>3/5</td><td>13/20</td></tr><tr><td>Fashion / BPC</td><td>4/5</td><td>3/5</td><td>3/5</td><td>3/5</td><td>11/20</td></tr><tr><td>Grocery / Q-Com</td><td>5/5</td><td>2/5</td><td>2/5</td><td>3/5</td><td>9/20</td></tr><tr><td>Insurance*</td><td>5/5</td><td>5/5</td><td>5/5</td><td>1/5</td><td>8/20</td></tr></tbody></table><p class="small" style="margin-top:12px">* Regulatory and market-access constraints discount the insurance score.</p>`},
{t:'black',chapter:'6. Category Opportunity',title:'Priorities 1 and 2',html:`<div class="grid-2"><article><div class="kicker">Priority 01 / Credit + Loans</div><h2 class="display slide-title">99.6%<br><span class="red-text">non-branded.</span></h2><p class="lead" style="margin-top:20px">Almost all loan search demand asks for options, not a named brand. Commissions reach 1–3% of disbursed value. No special aggregator license required.</p></article><article><div class="kicker">Priority 02 / Travel</div><h2 class="display slide-title">$18B<br><span class="red-text">and open.</span></h2><p class="lead" style="margin-top:20px">Meta-search behaviour is established, affiliate structures exist and online penetration remains below 50%.</p></article></div>`},
{t:'paper',chapter:'6. Category Opportunity',title:'Traffic and expansion',html:`<div class="grid-2"><div><div class="kicker">Priority 03 / Electronics</div><h2 class="display slide-title">Traffic engine.</h2><div class="metric-grid" style="margin-top:24px"><div class="metric"><strong>40M+</strong><span>combined monthly comparison visits</span></div><div class="metric"><strong>1–4%</strong><span>typical affiliate commission</span></div></div><p class="lead" style="margin-top:22px">High-intent and habit-forming—but volume-dependent.</p></div><div><div class="kicker">Expansion / Fashion + Beauty</div><h2 class="display slide-title">Margin layer.</h2><div class="metric-grid" style="margin-top:24px"><div class="metric"><strong>4–8%</strong><span>affiliate commission range</span></div><div class="metric"><strong>ZERO</strong><span>dominant neutral comparison tools</span></div></div><p class="lead" style="margin-top:22px">Review dependence creates a natural comparison surface.</p></div></div>`},
{t:'black',chapter:'6. Category Opportunity',title:'Watch and separate',html:`<div class="grid-2"><article><div class="kicker">Watch / Grocery + Q-Commerce</div><h2 class="display slide-title">Fast growth.<br><span class="red-text">No revenue rail.</span></h2><p class="lead" style="margin-top:24px">$7–8B and growing 110–130%, but no public affiliate programs. Monitor ONDC for the unlock.</p></article><article><div class="kicker">Long-term / Insurance</div><h2 class="display slide-title">The prize needs<br><span class="red-text">another entity.</span></h2><p class="lead" style="margin-top:24px">IRDAI license, 49% FDI cap and a sole-objective entity make insurance a parallel 24–36 month track.</p></article></div>`},
{t:'yellow',chapter:'6. Category Opportunity',title:'The category stack',html:`<div class="signal"><h2 class="display">Electronics<br>+ Credit<br>+ Travel<br><span class="outline">+ Expansion</span></h2><p class="note">Traffic. Revenue. Scale. Margin. Insurance runs beside the stack—not inside phase one.</p></div>`},
{t:'red',chapter:'7. Future of Discovery',title:'Future of commerce discovery',html:`<div class="divider-copy"><div class="kicker">Chapter 07</div><h2 class="display section-title">The next interface<br><span class="outline">is an agent.</span></h2><p class="lead">The next 36 months reshape how consumers discover, compare and transact.</p></div><div class="chapter-no">07</div>`},
{t:'black',chapter:'7. Future of Discovery',title:'AI, GEO and agentic commerce',html:`<div class="kicker">7.1–7.3 / AI, GEO, Agents</div><h2 class="display slide-title">Be the answer.<br><span class="red-text">And the data source.</span></h2><div class="grid-3" style="margin-top:32px"><article class="open-card yellow-line"><h3>AI Shopping Agents</h3><p>Consumers increasingly ask assistants for recommendations directly.</p></article><article class="open-card yellow-line"><h3>GEO + SEO</h3><p>Structured, authoritative and machine-readable comparisons win both surfaces.</p></article><article class="open-card yellow-line"><h3>Agentic Commerce</h3><p>APIs decide whether agents bypass you—or depend on you.</p></article></div>`},
{t:'paper',chapter:'7. Future of Discovery',title:'ONDC, voice & predictive',html:`<div class="grid-2"><div><div class="kicker">7.4 / ONDC</div><h2 class="display slide-title">Inventory without<br>the handshake.</h2><p class="lead" style="margin-top:20px">A buyer-side comparison app can access sellers across the network without one-by-one bilateral integrations.</p><figure class="figure contain" style="margin-top:24px"><img src="${A}ondc-architecture.jpg" alt="ONDC open network architecture"></figure></div><div><div class="kicker">7.5 + 7.6 / Voice + Predictive</div><h2 class="display slide-title">From search<br>to signal.</h2><div class="metric-grid" style="margin-top:24px"><div class="metric"><strong>25–30%</strong><span>annual voice-search growth</span></div><div class="metric"><strong>5</strong><span>priority regional languages</span></div></div><p class="lead" style="margin-top:22px">Monitor price, reviews and stock—then alert before the user asks.</p></div></div>`},
{t:'red',chapter:'8. Strategic Implications',title:'Strategic implications',html:`<div class="divider-copy"><div class="kicker">Chapter 08</div><h2 class="display section-title">Eight implications.<br><span class="outline">One market logic.</span></h2><p class="lead">The opportunity belongs to infrastructure-aware, category-disciplined entrants.</p></div><div class="chapter-no">08</div>`},
{t:'black',chapter:'8. Strategic Implications',title:'Strategic implications 1–4',html:`<div class="kicker">Synthesis / 01–04</div><div class="rank"><article><div><h3>Attractive—but vertical-specific</h3><p>Macro strength does not rescue a weak category model.</p></div></article><article><div><h3>Comparison intent is rising</h3><p>AI, reviews and ONDC strengthen the behaviour.</p></div></article><article><div><h3>Bharat is growth; metros validate</h3><p>Reverse the traditional metro-first rollout logic.</p></div></article><article><div><h3>Comparison-only is a filter</h3><p>Manageable everywhere except insurance.</p></div></article></div>`},
{t:'black',chapter:'8. Strategic Implications',title:'Strategic implications 5–8',html:`<div class="kicker">Synthesis / 05–08</div><div class="rank"><article><div><h3>GEO starts now</h3><p>AI-readable architecture cannot be retrofitted cheaply.</p></div></article><article><div><h3>Electronics + credit launch together</h3><p>Traffic and revenue address the same core consumer.</p></div></article><article><div><h3>Fashion + beauty expand margin</h3><p>Better economics demand deeper content investment.</p></div></article><article><div><h3>ONDC accelerates breadth</h3><p>Open inventory is the fastest route to category reach.</p></div></article></div>`},
{t:'red',chapter:'9. GTM Recommendations',title:'Go-to-market recommendations',html:`<div class="divider-copy"><div class="kicker">Chapter 09</div><h2 class="display section-title">Move in phases.<br><span class="outline">Build in layers.</span></h2><p class="lead">The launch sequence compounds audience, monetisation, partnerships and data.</p></div><div class="chapter-no">09</div>`},
{t:'paper',chapter:'9. GTM Recommendations',title:'Positioning',html:`<div class="kicker">9.1 / Recommended Positioning</div><h2 class="display slide-title">Two voices.<br>One platform.</h2><div class="grid-3" style="margin-top:30px"><article class="open-card"><h3>Comparison Site</h3><p>Clear and SEO-friendly—but commoditised.</p></article><article class="open-card" style="background:#fff0b8"><h3>AI Shopping Assistant</h3><p>Lead positioning for Gen Z and metro adoption.</p></article><article class="open-card"><h3>Commerce Intelligence</h3><p>Long-term B2C + B2B extension; avoid at launch.</p></article></div><blockquote class="quote" style="margin-top:32px">“AI shopping assistant” in metros. “Best price, guaranteed” for Tier 2/3.</blockquote>`},
{t:'black',chapter:'9. GTM Recommendations',title:'Launch sequence & segments',html:`<div class="grid-2"><div><div class="kicker">9.2 / Category Sequence</div><h2 class="display slide-title">Launch where<br><span class="red-text">intent is explicit.</span></h2><ol class="lead" style="font-size:16px;line-height:1.9"><li>Electronics + credit / loans</li><li>Travel meta-search</li><li>Fashion + beauty</li><li>Insurance subsidiary</li></ol></div><div><div class="kicker">9.3 / Segment Sequence</div><h2 class="display slide-title">Scale from<br><span class="red-text">the core out.</span></h2><ol class="lead" style="font-size:16px;line-height:1.9"><li>Urban male 25–35</li><li>Tier 2/3 value seeker</li><li>Female shopper 22–38</li><li>45+ trust seeker</li></ol></div></div>`},
{t:'paper',chapter:'9. GTM Recommendations',title:'Acquisition channels',html:`<div class="kicker">9.4 / Acquisition Channels</div><h2 class="display slide-title">Own intent.<br>Then own return.</h2><div class="grid-3" style="margin-top:28px"><article class="open-card"><h3>SEO</h3><p>Non-branded, high-intent comparison queries.</p></article><article class="open-card"><h3>GEO</h3><p>Structured data and AI-readable comparison feeds.</p></article><article class="open-card"><h3>YouTube</h3><p>Hindi + English “best under ₹X” formats.</p></article><article class="open-card"><h3>Influencers</h3><p>Mid-tier finance, tech and fashion creators.</p></article><article class="open-card"><h3>WhatsApp</h3><p>Price alerts, summaries and peer sharing.</p></article><article class="open-card"><h3>Affiliate Networks</h3><p>Publisher reach via vCommission and Admitad.</p></article></div>`},
{t:'black',chapter:'9. GTM Recommendations',title:'36-month roadmap',html:`<div class="kicker">9.5 / Recommended Launch Roadmap</div><h2 class="display slide-title">Three phases.<br><span class="red-text">One compounding system.</span></h2><div class="roadmap"><article class="phase"><b>0–12</b><h3>Foundation</h3><ul><li>Electronics + credit / loans</li><li>500+ English + Hindi SEO pages</li><li>Android-first app</li><li>File IRDAI application at M6</li></ul></article><article class="phase"><b>12–24</b><h3>Scale</h3><ul><li>Travel meta-search</li><li>Tamil + Telugu content</li><li>ONDC buyer-app</li><li>Fashion soft launch</li><li>WhatsApp alerts</li></ul></article><article class="phase"><b>24–36</b><h3>Dominance</h3><ul><li>Insurance subsidiary</li><li>Beauty + personal care</li><li>AI review summaries</li><li>Bharat voice expansion</li><li>B2B intelligence layer</li></ul></article></div>`},
{t:'paper',chapter:'9. GTM Recommendations',title:'Critical success factors',html:`<div class="kicker">9.6 / Critical Success Factors</div><h2 class="display slide-title">Five things<br>that cannot wait.</h2><div class="grid-4" style="margin-top:28px"><article class="open-card"><h3>Vernacular</h3><p>Day 1, not Day 300.</p></article><article class="open-card"><h3>Sub-2s Mobile</h3><p>4G speed is a strategic requirement.</p></article><article class="open-card"><h3>Structured Data</h3><p>Build schema and feeds in week one.</p></article><article class="open-card"><h3>15+ Merchants</h3><p>Diversify affiliate concentration.</p></article></div><article class="open-card" style="margin-top:1px;min-height:120px"><h3>Trust must be visible</h3><p>Verified reviews and sellers are not UI details. They are the differentiation.</p></article>`},
{t:'yellow',chapter:'Recommendation',title:'The window',html:`<div class="signal"><h2 class="display">18–24<br><span class="outline">months.</span></h2><p class="note">Move on Phase 1 while non-branded search remains contestable and before ONDC-native and AI-native challengers build authority.</p></div>`},
{t:'red',chapter:'Closing',title:'Closing recommendation',html:`<div class="divider-copy"><div class="kicker">ANTIGEN'S TAKE</div><h2 class="display section-title">Do not build<br>a price checker.<br><span class="accent">Build the trust layer.</span></h2><p class="lead">Mobile-first. Vernacular from day one. Structured for search, agents and ONDC. Electronics for traffic; finance for revenue.</p></div><div class="meta">ANTIGEN / INSURGENT STRATEGY / SILIGURI / ANTIGEN.IN</div>`},
{t:'black',chapter:'Sources',title:'Sources & notes',html:`<div class="grid-2"><div><div class="kicker">Source Material</div><h2 class="display slide-title">Evidence,<br>not ornament.</h2><p class="lead" style="margin-top:24px">Compiled from the India Comparison Commerce Report and supporting ANTIGEN strategy visuals supplied for this presentation.</p></div><div class="small" style="line-height:1.9;border-left:1px solid #444;padding-left:32px"><p><b>Primary report:</b> India Comparison Commerce — Market Insights & Go-To-Market Strategy, June 2026.</p><p><b>Supporting visual reports:</b> India Digital Shopper Decision Journey; The 2026 Decision Loop; The Digital Bharat Blueprint; The India E-Commerce Blueprint.</p><p><b>Underlying report sources:</b> Similarweb, Semrush, IRDAI, IRCTC, PB Fintech filings, Techmagnate and public market research.</p><p style="margin-top:24px;color:#aaa">For discussion purposes only. Figures reflect the supplied source documents.</p></div></div>`}
];

const CHAPTER_INTEL={
  'Contents':{thesis:'The report is organised as a chain of decisions: market readiness, consumer behaviour, insertion point, competitive space, category stack and execution.',bullets:['Use this page as the permanent navigation hub.','Each numbered chapter follows the supplied TOC and ends in a strategic implication.','The centrepiece is Chapter 5: who owns comparison behaviour and where durable white space remains.']},
  'Executive Summary':{thesis:'India is attractive only when category economics and comparison behaviour are considered together.',bullets:['Electronics is the traffic flywheel; credit and loans are the revenue engine.','Travel adds scale through established affiliate rails.','Insurance requires a separate licensed entity and parallel timeline.','The core product should compare trust, delivery, returns and financing—not price alone.']},
  '1. Market Context':{thesis:'India combines massive demographic demand with unusually strong public digital rails, but behaves as several distinct markets.',bullets:['1.44B people; median age 28; 600M+ Gen Z and Millennials.','60% of new online shoppers originate in Tier 2/3 cities.','750M+ smartphone users and among the world’s lowest mobile-data costs.','UPI reduces payment friction; ONDC opens inventory; India Stack simplifies KYC.','350M+ regional-language users make vernacular depth a product requirement.']},
  '2. Commerce Landscape':{thesis:'Five commerce models create five different comparison jobs, making cross-model aggregation more defensible than marketplace-only price checking.',bullets:['Marketplace: price, seller and reliability.','Quick commerce: availability, speed and landed cost.','Social commerce: authenticity and peer trust.','D2C: discovery, claims and review quality.','ONDC: network-wide inventory through buyer-side apps.','Risks: regulation, counterfeits, affiliate volatility and platform concentration.']},
  '3. The Shopper':{thesis:'The Indian shopper is structurally comparison-ready: price-sensitive, review-dependent and willing to switch platforms.',bullets:['Gen Z checks 3–4 platforms and discovers through social video.','Tier 2/3 value seekers require vernacular content, COD visibility and return clarity.','Female shoppers weight reviews, authenticity and brand safety heavily.','45+ users need simpler decision structures and stronger trust cues.','The average journey touches 3.4 platforms.']},
  '4. Decision Journey':{thesis:'The opportunity is to enter before crude price checking and remain useful after checkout.',bullets:['Discovery: intercept non-branded search, social video and AI matching.','Research: aggregate verified reviews, visual search and vernacular content.','Comparison: unify price, trust, delivery, returns, warranty and BNPL.','Checkout: surface UPI, COD and financing without friction.','Post-purchase: create a review and replenishment data flywheel.']},
  '5. Competitive Landscape':{thesis:'Comparison traffic is proven, but durable profitability is concentrated in lending and insurance.',bullets:['Electronics aggregators collectively attract 40M+ monthly visits.','PolicyBazaar owns insurance; BankBazaar and Paisabazaar compete in lending.','No platform owns neutral comparison across categories.','White space clusters around multidimensional trust, vernacular depth, ONDC and AI summaries.','The moat is a horizontal intelligence layer, not another isolated vertical.']},
  '6. Category Opportunity':{thesis:'The correct unit of strategy is the category stack: traffic, revenue, scale and expansion economics.',bullets:['Credit/loans: 17/20 and 99.6% non-branded search demand.','Travel: 15/20 with explicit meta-search behaviour.','Electronics: 13/20; high traffic, thin 1–4% commissions.','Fashion and beauty: 4–8% commissions and no dominant neutral comparator.','Q-commerce stays on watch; insurance needs a separate entity.']},
  '7. Future of Discovery':{thesis:'Comparison platforms must become structured data sources for humans, search engines and autonomous agents.',bullets:['SEO remains the acquisition base; GEO must be built in parallel.','Agent-accessible APIs determine whether AI bypasses or depends on the platform.','ONDC solves inventory breadth without bilateral negotiation.','Voice and five priority languages create a Bharat opportunity.','Predictive monitoring turns one-off visits into a relationship.']},
  '8. Strategic Implications':{thesis:'The market rewards infrastructure awareness, category discipline and speed.',bullets:['Launch electronics and credit together.','Build Bharat capability from day one.','Treat comparison-only as an entry filter, especially for insurance.','Invest early in structured data and AI-readable feeds.','Use ONDC as an accelerant to breadth.']},
  '9. GTM Recommendations':{thesis:'A phased 36-month model compounds audience, monetisation, merchant access and proprietary data.',bullets:['Position as an AI shopping assistant in metros and a price/trust utility in Tier 2/3.','Phase 1: electronics + credit/loans, Hindi + English, Android-first.','Phase 2: travel, Tamil + Telugu, ONDC buyer app, WhatsApp alerts.','Phase 3: insurance subsidiary, beauty, AI summaries and Bharat voice.','Non-negotiables: sub-two-second UX, structured data and visible trust.']}
};

const rail=document.getElementById('rail');
const total=document.getElementById('total');
const current=document.getElementById('current');
const chapterLabel=document.getElementById('chapterLabel');
const progressBar=document.getElementById('progressBar');
const toc=document.getElementById('toc');
const tocList=document.getElementById('tocList');
const pad=n=>String(n).padStart(2,'0');

slides.forEach((s,i)=>{
  const section=document.createElement('section');
  section.className=`slide ${s.t}`;
  section.id=`slide-${i+1}`;
  section.dataset.page=pad(i+1);
  section.dataset.chapter=s.chapter;
  section.setAttribute('aria-label',s.title||s.chapter);
  section.innerHTML=s.html;
  rail.appendChild(section);
  const link=document.createElement('a');
  link.href=`#slide-${i+1}`;
  link.innerHTML=`<small>${pad(i+1)}</small><span>${s.title||s.chapter}</span>`;
  link.addEventListener('click',()=>closeToc());
  tocList.appendChild(link);
});
total.textContent=pad(slides.length);

document.querySelectorAll('[data-chapter-target]').forEach(button=>{
  button.addEventListener('click',()=>{
    const target=button.dataset.chapterTarget;
    const index=slides.findIndex(s=>s.chapter===target);
    if(index>=0) go(index);
  });
});

document.querySelectorAll('.step,.phase').forEach(module=>{
  module.classList.add('interactive');
  module.setAttribute('tabindex','0');
  module.setAttribute('role','button');
  const activate=()=>{
    const heading=module.querySelector('h3')?.textContent||'Interactive module';
    const copy=module.querySelector('p,ul')?.textContent||'';
    openIntel({title:heading,thesis:copy,bullets:CHAPTER_INTEL[slides[active].chapter]?.bullets||[]});
  };
  module.addEventListener('click',activate);
  module.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}});
});

let active=0;
function go(index){active=Math.max(0,Math.min(slides.length-1,index));rail.children[active].scrollIntoView({behavior:'smooth',inline:'start'});update();}
function update(){current.textContent=pad(active+1);chapterLabel.textContent=slides[active].chapter.toUpperCase();progressBar.style.width=`${((active+1)/slides.length)*100}%`;history.replaceState(null,'',`#slide-${active+1}`);renderIntel()}
document.getElementById('prev').addEventListener('click',()=>go(active-1));
document.getElementById('next').addEventListener('click',()=>go(active+1));
rail.addEventListener('scroll',()=>{const idx=Math.round(rail.scrollLeft/innerWidth);if(idx!==active){active=idx;update()}},{passive:true});
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(active+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(active-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key==='Escape')closeToc()});
let touchX=0;rail.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});rail.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>60)go(active+(d<0?1:-1))},{passive:true});
function openToc(){toc.classList.add('open');toc.setAttribute('aria-hidden','false');document.getElementById('tocToggle').setAttribute('aria-expanded','true')}
function closeToc(){toc.classList.remove('open');toc.setAttribute('aria-hidden','true');document.getElementById('tocToggle').setAttribute('aria-expanded','false')}
document.getElementById('tocToggle').addEventListener('click',openToc);document.getElementById('tocClose').addEventListener('click',closeToc);
const intelPanel=document.getElementById('intelPanel');
const intelBody=document.getElementById('intelBody');
function renderIntel(override){
  const s=slides[active];
  const data=override||CHAPTER_INTEL[s.chapter]||{thesis:'This page consolidates the strategic conclusion from the supplied report.',bullets:['Use the interactive contents page to return to any numbered chapter.','The evidence layer remains available throughout the document.']};
  const bullets=(data.bullets||[]).map(b=>`<li>${b}</li>`).join('');
  const related=['1. Market Context','4. Decision Journey','5. Competitive Landscape','6. Category Opportunity','9. GTM Recommendations'].filter(c=>c!==s.chapter).slice(0,4);
  intelBody.innerHTML=`<div class="intel-kicker">PAGE ${pad(active+1)} / ${s.chapter}</div><h2>${data.title||s.title||s.chapter}</h2><div class="intel-thesis">${data.thesis}</div><h3>Supporting evidence & implications</h3><ul>${bullets}</ul><h3>Related sections</h3><div class="intel-links">${related.map(c=>`<button data-intel-jump="${c}">${c}</button>`).join('')}</div>`;
  intelBody.querySelectorAll('[data-intel-jump]').forEach(b=>b.addEventListener('click',()=>{const i=slides.findIndex(s=>s.chapter===b.dataset.intelJump);if(i>=0){closeIntel();go(i)}}));
}
function openIntel(override){renderIntel(override);intelPanel.classList.add('open');intelPanel.setAttribute('aria-hidden','false');document.getElementById('intelToggle').setAttribute('aria-expanded','true')}
function closeIntel(){intelPanel.classList.remove('open');intelPanel.setAttribute('aria-hidden','true');document.getElementById('intelToggle').setAttribute('aria-expanded','false')}
document.getElementById('intelToggle').addEventListener('click',()=>openIntel());
document.getElementById('intelClose').addEventListener('click',closeIntel);
document.getElementById('backToToc').addEventListener('click',()=>{closeIntel();go(1)});
const hash=Number(location.hash.replace('#slide-',''));if(hash>0)active=Math.min(hash-1,slides.length-1);requestAnimationFrame(()=>go(active));
</script>
</body>
</html>
