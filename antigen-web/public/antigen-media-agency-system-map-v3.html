rocess, the retainer becomes indefensible unless the thinking layer is genuinely differentiated."}},{id:"PM",label:"Performance",sublabel:"Fees",group:"revenue",state:"healthy",typology:"unchanged",x:320,y:210,insight:{headline:"Structurally Misaligned",body:"Performance fees are tied to media outcomes (CTR, ROAS, viewability) rather than business outcomes. This means the agency is incentivised to optimise metrics partially within its control — not the growth problems the client actually needs solved.",implication:"Performance fees sound rigorous but measure the wrong things. They reinforce execution culture at the expense of strategic culture."}},{id:"AV",label:"Audit",sublabel:"Vulnerability",group:"revenue",state:"failing",typology:"changing",x:245,y:308,insight:{headline:"The Structural Exposure",body:"Audit vulnerability is a direct consequence of the rebate architecture. As client marketing sophistication grows, the probability of a forensic audit increases. AI-powered audit tools are democratising the ability to surface discrepancies.",implication:"The audit risk is not a compliance problem. It's a trust problem that is one procurement review away from becoming a commercial crisis."}},{id:"BP",label:"Brief &",sublabel:"Planning ⚠",group:"ops",state:"failing",typology:"changed",x:570,y:122,insight:{headline:"THE FAILING NODE — The Thinking Layer Is Isolated",body:"Brief & Planning is funded by the retainer but receives no intelligence from the Data & Tech stack. It has no direct feed from Pitch & New Business. AI tools have made this node faster and more uniform simultaneously. Every agency is running the same planning process at higher velocity.",implication:"Originality cannot emerge from a node that is both isolated and accelerating."}},{id:"MC",label:"Media",sublabel:"Channel Mix",group:"ops",state:"stressed",typology:"unchanged",x:488,y:265,insight:{headline:"Distorted by Incentives, Not Strategy",body:"Channel Mix is determined by Brief & Planning — but simultaneously distorted by the rebate loop from above. The stated driver is strategy. The actual driver is a combination of strategic preference and financial incentive. These two inputs are never reconciled transparently.",implication:"A channel recommendation cannot be fully trusted by anyone in the system — including the people making it."}},{id:"TP",label:"Trading &",sublabel:"Programmatic",group:"ops",state:"healthy",typology:"unchanged",x:628,y:328,insight:{headline:"Where All the Tech Investment Went",body:"The trading and programmatic layer is the most heavily resourced part of the agency's tech stack. DT flows directly and powerfully here. AI has been deployed most aggressively — bidding algorithms, audience modelling, frequency capping, attribution. It works.",implication:"The agency has built world-class execution infrastructure. The intelligence lives in the wrong place."}},{id:"MS",label:"Measurement",sublabel:"& Reporting",group:"ops",state:"stressed",typology:"unchanged",x:712,y:205,insight:{headline:"Serving Two Masters Badly",body:"Measurement & Reporting simultaneously exposes Audit Vulnerability and shapes Client Trust. These are conflicting imperatives. When reporting is designed to manage audit risk it conceals. When designed to build trust it reveals. The agency cannot fully optimise for both.",implication:"Measurement Theater is the result — reports that are technically accurate, strategically meaningless, and emotionally reassuring."}},{id:"DT",label:"Data & Tech",sublabel:"Stack ⟳",group:"ops",state:"misrouted",typology:"changing",x:750,y:355,insight:{headline:"MISROUTED — Intelligence Deployed Downstream",body:"The Data & Tech Stack is substantial and well-invested. It routes powerfully to Trading & Programmatic and to Measurement. It does NOT route to Brief & Planning — the node where strategic differentiation is actually produced. This is the central architectural failure.",implication:"Rewiring DT → BP is the highest-leverage architectural intervention available. It doesn't require new tools. It requires new connections."}},{id:"CT",label:"Client",sublabel:"Trust",group:"client",state:"stressed",typology:"changing",x:870,y:118,insight:{headline:"Eroding at the Edges",body:"Client Trust is shaped by Measurement & Reporting — which is compromised — and threatened by Strategy Homogeneity from the disruption layer. Clients are beginning to sense that the strategic outputs they receive are structurally similar to what every other agency is producing.",implication:"Trust erodes silently until a competitor offers something that feels genuinely different."}},{id:"RC",label:"Relationship",sublabel:"Concentration",group:"client",state:"failing",typology:"unchanged",x:968,y:245,insight:{headline:"The Hidden Fragility",body:"Relationship Concentration means a small number of senior client contacts hold disproportionate account value. High CM clients are building in-house capability and reducing retainer dependency. The portfolio is simultaneously over-concentrated and structurally thinning.",implication:"One senior client departure can cascade into a revenue crisis. The agency's resilience against this is pitch capability — which is also under stress."}},{id:"CC",label:"Creative Agency",sublabel:"Dependencies",group:"client",state:"stressed",typology:"unchanged",x:768,y:80,insight:{headline:"A Diminishing Input",body:"Creative Agency Dependencies feed Brief & Planning — meaning the quality of the agency's strategic starting point is partly determined by the quality of the brief it receives from creative partners. As creative agencies also overindex on AI and produce more generic briefs, this upstream input degrades.",implication:"The agency has no control over the quality of this input and no internal intelligence source to compensate."}},{id:"CM",label:"Client Mktg",sublabel:"Capability",group:"client",state:"stressed",typology:"changing",x:1005,y:118,insight:{headline:"The Double-Edged Variable",body:"Client Marketing Capability creates two opposite pressures simultaneously: low CM inflates relationship lock-in (good for retention, bad for the client), while high CM threatens the retainer as clients build in-house. The industry trend is clear: CM is rising.",implication:"Rising client capability means mediocre strategy has a shorter half-life."}},{id:"PC",label:"Pitch & New",sublabel:"Business ⚠",group:"client",state:"stressed",typology:"changed",x:888,y:342,insight:{headline:"STRESSED — Drawing from the Wrong Wells",body:"Pitch & New Business compensates for Relationship Concentration and requires proof from Measurement. It has NO connection to Brief & Planning — the agency's thinking capability. AI tools have accelerated pitch production. They have not improved pitch thinking.",implication:"Every pitch this agency produces is structurally identical to what it produced last year — faster, more polished, no more original."}},{id:"AI_D",label:"AI Tool",sublabel:"Proliferation",group:"disruption",state:"disruption",typology:"changed",x:548,y:458,insight:{headline:"🔴 Industry-Wide Disruption",body:"Every agency now has access to the same AI planning tools. GPT, Claude, Gemini, Perplexity — all being used to generate insight summaries, audience analysis, trend reports, and strategic frameworks. The tools are democratised. The thinking behind them is not differentiated.",implication:"AI has made the industry faster at producing the same thing. Agencies that mistake velocity for originality are accelerating their own irrelevance."}},{id:"HO",label:"Strategy",sublabel:"Homogeneity",group:"disruption",state:"disruption",typology:"changed",x:710,y:475,insight:{headline:"🔴 Category-Level Signal",body:"Strategy Homogeneity is the emergent property of AI proliferation meeting an industry with identical operational architectures. When every agency uses the same tools on the same briefs with the same planning process, outputs converge. Clients are beginning to notice.",implication:"Homogeneity is not a trend to respond to. It is the system's current steady state. Differentiation now requires structural change, not better prompts."}},{id:"CP",label:"Creative–Media",sublabel:"Convergence",group:"disruption",state:"disruption",typology:"changing",x:870,y:462,insight:{headline:"🟡 Structural Pressure",body:"The traditional separation between creative and media agencies is dissolving. Clients are questioning why they need two separate retainers. Consultancies are pitching integrated capability. This convergence pressure directly threatens Creative Agency Dependencies.",implication:"The convergence is an opportunity if the agency can build genuine creative-intelligence capability. It is an existential threat if it cannot."}}],c=[{from:"MB",to:"RK",label:"volume drives",state:"active",typology:"unchanged",insight:{headline:"The Scale-Rebate Loop",body:"Higher buying volume unlocks higher rebate tiers from media owners. Creates a direct financial incentive to maintain or grow buying volume regardless of whether that volume optimally serves client strategy.",implication:"Volume growth serves the agency's P&L. It may or may not serve the client's brand."}},{from:"RK",to:"MC",label:"distorts",state:"distorted",typology:"unchanged",insight:{headline:"The Hidden Influence on Strategy",body:"Rebate eligibility distorts channel recommendations downstream. The agency may genuinely believe its channel mix recommendations are strategy-led — but the financial architecture creates an unconscious bias toward higher-rebate channels.",implication:"This connection is the single most corrosive element in the system's integrity."}},{from:"CR",to:"BP",label:"funds",state:"active",typology:"unchanged",insight:{headline:"Paying for Thinking, Getting Process",body:"The retainer funds the planning function. But funding a node doesn't determine what that node produces. The retainer assumes strategic value will be generated. The architecture ensures it won't be — not without rewiring DT → BP.",implication:"Clients are paying a strategy tax to fund a process function."}},{from:"BP",to:"MC",label:"determines",state:"distorted",typology:"changing",insight:{headline:"A Weakened Determination",body:"Brief & Planning nominally determines Channel Mix — but is doing so from an isolated, intelligence-starved position while also being distorted by the rebate incentive from above. This connection is present but degraded.",implication:"Channel Mix is being determined by a failing node. The downstream quality is structurally limited."}},{from:"MC",to:"MB",label:"feeds",state:"active",typology:"unchanged",insight:{headline:"The Commercial Loop Closes",body:"Channel Mix decisions feed back into Buying Volume — completing the commercial architecture loop. More channels, more volume, more rebates. The loop reinforces itself regardless of strategic quality.",implication:"This loop is self-sustaining. It doesn't need good strategy to keep running."}},{from:"MB",to:"TP",label:"scale justifies",state:"active",typology:"unchanged",insight:{headline:"Volume Pays for Infrastructure",body:"Buying volume at scale justifies the investment in programmatic trading infrastructure. This is a healthy and rational connection — the problem is not here but in where the tech investment flows next.",implication:"The justification is sound. The routing is not."}},{from:"TP",to:"MS",label:"generates",state:"active",typology:"unchanged",insight:{headline:"Data Rich, Insight Poor",body:"Programmatic trading generates enormous volumes of performance data that flows into Measurement & Reporting. The data is real. The question is whether it's being converted into genuine insight or processed into reassuring dashboards.",implication:"Volume of data is not the same as quality of insight."}},{from:"MS",to:"AV",label:"exposes or conceals",state:"distorted",typology:"unchanged",insight:{headline:"The Double Function of Reporting",body:"Measurement & Reporting simultaneously reveals and manages audit vulnerability. When it reveals, it builds trust. When it conceals, it manages risk. The agency cannot fully commit to either without compromising the other.",implication:"Reporting that serves two masters serves neither well."}},{from:"AV",to:"CR",label:"threatens",state:"active",typology:"changing",insight:{headline:"The Structural Risk to Revenue",body:"Audit Vulnerability is a latent threat to the retainer. As long as the rebate architecture exists and measurement is managing rather than revealing, every client relationship contains a potential audit event that could terminate the commercial relationship.",implication:"The retainer is not as secure as the pipeline suggests."}},{from:"PM",to:"RK",label:"misaligned with",state:"distorted",typology:"unchanged",insight:{headline:"Incentives That Don't Align",body:"Performance fees and rebates create competing incentive structures. Performance fees nominally align the agency with client outcomes. Rebates align the agency with media owner volume. These two incentive streams pull in different strategic directions.",implication:"The agency is being paid to do two different things at once."}},{from:"DT",to:"TP",label:"wired to",state:"active",typology:"unchanged",insight:{headline:"Intelligence in the Wrong Place",body:"Data & Tech Stack flows strongly to Trading & Programmatic. This is where AI investment has concentrated. The execution layer is genuinely world-class.",implication:"The problem is not that DT is weak. The problem is where it connects."}},{from:"DT",to:"MS",label:"should power",state:"active",typology:"unchanged",insight:{headline:"A Partial Connection",body:"DT connects to Measurement — giving reporting a data backbone. This is functional but insufficient. Measurement powered by good data can still produce Measurement Theater if the reporting function is designed to manage rather than reveal.",implication:"Data in, theater out."}},{from:"DT",to:"BP",label:"NOT connected",state:"missing",typology:"changed",insight:{headline:"THE CRITICAL MISSING EDGE",body:"The Data & Tech Stack has no connection to Brief & Planning. This is the central architectural failure. The intelligence infrastructure that could make planning genuinely differentiated is wired entirely to execution and reporting — never to thinking.",implication:"Building this connection is the highest-leverage architectural intervention. It doesn't require new tools. It requires new wiring."}},{from:"MS",to:"CT",label:"shapes perception of",state:"active",typology:"changing",insight:{headline:"Reporting as Trust Infrastructure",body:"Measurement & Reporting is the primary touchpoint through which clients assess the agency's value. When reporting is functional but strategically thin, trust erodes at the margin — slowly, then suddenly.",implication:"Trust is built through insight, not dashboards."}},{from:"CT",to:"RC",label:"determines",state:"active",typology:"changing",insight:{headline:"Trust Creates Dependency",body:"Client Trust determines the depth of Relationship Concentration. High trust deepens relationships and creates dependency. Low trust triggers diversification. As trust erodes, clients reduce concentration risk — which reduces the agency's revenue resilience.",implication:"The trust erosion trend has a direct commercial consequence."}},{from:"RC",to:"CR",label:"concentration risk",state:"distorted",typology:"unchanged",insight:{headline:"The Fragility Is Structural",body:"Relationship Concentration creates fragility in the retainer base. This is not a relationship management problem — it's an architectural risk. The commercial architecture is built on a small number of deep relationships rather than a large number of diversified ones.",implication:"Resilience requires distribution. The current architecture concentrates risk."}},{from:"CC",to:"BP",label:"execution dependency",state:"distorted",typology:"changing",insight:{headline:"A Degrading Upstream Input",body:"Creative Agency Dependencies feed Brief & Planning. As creative agencies themselves overindex on AI and produce more generic briefs, this upstream input quality degrades. BP is already isolated from internal intelligence — its primary external input is also weakening.",implication:"Brief & Planning is being squeezed from both sides."}},{from:"CM",to:"RC",label:"low CM inflates",state:"active",typology:"unchanged",insight:{headline:"Dependency as Commercial Insurance",body:"When clients have low marketing capability, they depend more heavily on the agency — deepening relationships and making retainment easier. This creates a perverse incentive: the agency benefits from clients remaining strategically dependent.",implication:"An agency that profits from client dependency cannot be fully trusted to develop client capability."}},{from:"CM",to:"CR",label:"high CM threatens",state:"distorted",typology:"changing",insight:{headline:"Sophistication Reduces Tolerance for Mediocrity",body:"Rising client marketing capability directly threatens the retainer. Sophisticated clients can evaluate strategic quality, run their own data analysis, and increasingly build in-house teams for functions they previously outsourced.",implication:"CM is trending upward across the industry. The retainer model is under structural pressure."}},{from:"PC",to:"RC",label:"compensates for",state:"active",typology:"unchanged",insight:{headline:"New Business Covers Old Fragility",body:"Pitch & New Business is being used as a hedge against Relationship Concentration risk. But pitches won on the basis of price and process — rather than genuine strategic differentiation — create new relationships that have the same fragility as the ones they replaced.",implication:"Winning without differentiating doesn't solve the problem. It defers it."}},{from:"PC",to:"MS",label:"requires proof from",state:"active",typology:"unchanged",insight:{headline:"Pitching Backwards from Performance",body:"Pitch & New Business requires proof from Measurement — meaning pitch narratives are assembled from historical performance data. This backwards-looking architecture means every pitch is fundamentally an argument from precedent, not an argument from possibility.",implication:"Pitches that prove what you've done are not compelling when every agency has done the same thing."}},{from:"PC",to:"BP",label:"NOT fed by",state:"missing",typology:"changed",insight:{headline:"THE SECOND MISSING EDGE",body:"Pitch & New Business has no connection to Brief & Planning. The agency's thinking capability does not feed its pitch capability. Pitches are assembled from data and relationships, not from strategic intelligence.",implication:"Connecting PC ← BP would make pitches a genuine demonstration of strategic capability rather than a presentation of historical proof."}},{from:"AI_D",to:"BP",label:"commoditises",state:"disruption",typology:"changed",insight:{headline:"AI Doing to Thinking What Programmatic Did to Buying",body:"AI planning tools have commoditised the brief & planning function at the industry level. Every agency now produces insight reports, audience analyses, and trend syntheses using the same underlying models.",implication:"The node that needed differentiation most has been standardised hardest."}},{from:"AI_D",to:"HO",label:"accelerates",state:"disruption",typology:"changed",insight:{headline:"Speed × Uniformity = Homogeneity",body:"AI tools accelerate production of strategic output while simultaneously narrowing the range of outputs produced. Faster convergence on identical conclusions.",implication:"The problem is not that AI is being used. The problem is that it's being used to do the same thing faster, not different things."}},{from:"HO",to:"PC",label:"undermines",state:"disruption",typology:"changed",insight:{headline:"Homogeneity Kills Pitch Differentiation",body:"Strategy Homogeneity directly undermines Pitch & New Business. When every agency's strategic output is structurally similar, pitch decisions default to price, incumbency, and relationship depth.",implication:"The pitch is being decided before the strategic work begins."}},{from:"HO",to:"CT",label:"erodes",state:"disruption",typology:"changed",insight:{headline:"Clients Can Feel It",body:"Clients experiencing Strategy Homogeneity lose confidence in the strategic value they're paying for. They may not be able to articulate it precisely, but they sense that the thinking they're receiving is not genuinely original.",implication:"Trust erodes silently until a competitor offers something that feels different."}},{from:"CP",to:"CC",label:"threatens",state:"disruption",typology:"changing",insight:{headline:"Convergence Destabilises the Brief Supply Chain",body:"Creative–Media convergence pressure threatens the existing Creative Agency Dependency architecture. Clients questioning the need for separate creative and media retainers destabilise the briefing relationships that feed planning.",implication:"The upstream brief supply chain is threatened by the same structural forces that threaten the agency directly."}},{from:"CP",to:"MC",label:"pressures",state:"disruption",typology:"changing",insight:{headline:"Channel Strategy Under Convergence",body:"As creative and media responsibilities converge, the definition of what a media agency should own in channel strategy is becoming contested. Consultancies and creative agencies are pitching integrated channel capability.",implication:"The agency's ownership of channel strategy is not guaranteed."}}],f="#e31d28",d="#b11226",p="#ffffff",h="#f8f7f6",g="#e8e8e8",m="#9fa2a4",y="#08a7d8",b="#ffc000",v={healthy:{fill:"#eef7f2",stroke:"#2a9d5c",text:"#1a6e3c",label:"Healthy"},stressed:{fill:"#fff8e6",stroke:b,text:"#7a5700",label:"Stressed"},failing:{fill:"#fde8e9",stroke:f,text:d,label:"Failing"},misrouted:{fill:"#e6f4fb",stroke:y,text:"#065a7a",label:"Misrouted"},disruption:{fill:"#f3e8f9",stroke:"#8e44ad",text:"#5b2c6f",label:"Disruption"}},k={active:{stroke:"#aaaaaa",dash:"
