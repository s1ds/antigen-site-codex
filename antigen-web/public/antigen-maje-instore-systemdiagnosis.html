// ─── HELPERS ────────────────────────────────────────────────────────────────
function findNode(id) { return NODES.find(n => n.id === id); }

function arcPath(from, to, curved) {
  if (!curved) {
    const mx = from.x + 0.5*(to.x-from.x), my = from.y + 0.5*(to.y-from.y) - 0.06*Math.abs(to.x-from.x);
    return `M ${from.x} ${from.y} Q ${mx} ${my} ${to.x} ${to.y}`;
  }
  const dx = to.x-from.x, dy = to.y-from.y, r = 0.72*Math.sqrt(dx*dx+dy*dy);
  return `M ${from.x} ${from.y} A ${r} ${r} 0 0 0 ${to.x} ${to.y}`;
}

// ─── CALLOUT PANEL ──────────────────────────────────────────────────────────
function Callout({ d, onClose, containerWidth }) {
  const ns = NODE_STYLES[d.state] || {};
  const es = EDGE_STYLES[d.state];
  const isEdge = !!es && !ns.fill;
  const strokeColor = isEdge ? es.stroke : (ns.stroke || RED);
  const stateLabel  = isEdge ? es.label  : (ns.label  || d.state);
  const typo = TYPO_STYLES[d.typo];
  const cx = d.pos.x + 326 + 32 > containerWidth
    ? Math.max(8, d.pos.x - 326 - 12)
    : d.pos.x + 12;

  return h("div", {
    style: {
      position: "absolute", left: cx, top: Math.max(8, d.pos.y - 36),
      width: 326, zIndex: 200, background: WHITE,
      border: `2px solid ${strokeColor}`,
      boxShadow: `6px 6px 0 ${strokeColor}33`,
      fontFamily: "'Montserrat',sans-serif",
      animation: "calloutIn .16s ease"
    }
  },
    h("div", { style: { background: strokeColor, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" } },
      h("div", null,
        h("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 19, color: WHITE, lineHeight: 1, letterSpacing: "0.05em" } }, d.title),
        d.sub && h("div", { style: { fontSize: 9, color: "rgba(255,255,255,.72)", marginTop: 2, fontWeight: 700, letterSpacing: "0.07em", textTransform: "uppercase" } }, d.sub)
      ),
      h("button", { onClick: onClose, style: { background: "none", border: "none", color: WHITE, cursor: "pointer", fontSize: 17, lineHeight: 1, padding: "0 2px", marginLeft: 8, opacity: .8 } }, "×")
    ),
    h("div", { style: { display: "flex", gap: 6, padding: "7px 12px", borderBottom: `1px solid ${BORDER}`, background: PAPER } },
      h("span", { style: { fontSize: 9, fontWeight: 800, letterSpacing: "0.09em", padding: "3px 8px", background: ns.fill || WHITE, border: `1.5px solid ${strokeColor}`, color: strokeColor, textTransform: "uppercase" } }, stateLabel),
      typo && h("span", { style: { fontSize: 9, fontWeight: 800, letterSpacing: "0.09em", padding: "3px 8px", background: typo.bg, border: `1.5px solid ${typo.border}`, color: typo.text, textTransform: "uppercase" } }, typo.label)
    ),
    h("div", { style: { padding: "12px 14px" } },
      h("div", { style: { fontSize: 10.5, fontWeight: 800, color: strokeColor, marginBottom: 6, lineHeight: 1.3, textTransform: "uppercase", letterSpacing: "0.02em" } }, d.ins.headline),
      h("div", { style: { fontSize: 11.5, color: "#444", lineHeight: 1.65, marginBottom: 10, fontWeight: 500 } }, d.ins.body),
      h("div", { style: { padding: "8px 10px", background: `${strokeColor}12`, borderLeft: `3px solid ${strokeColor}`, fontSize: 11, color: strokeColor, lineHeight: 1.5, fontWeight: 700, fontStyle: "italic" } }, d.ins.implication)
    )
  );
}

// ─── FILTER BUTTONS ─────────────────────────────────────────────────────────
function NodeBtn({ label, fill, stroke, text, active, onClick }) {
  return h("button", {
    onClick, style: { display: "inline-flex", alignItems: "center", gap: 5, padding: "4px 10px",
      border: `1.5px solid ${active ? stroke : BORDER}`, background: active ? fill : WHITE,
      cursor: "pointer", fontFamily: "'Montserrat',sans-serif", fontSize: 9, fontWeight: 800,
      letterSpacing: "0.1em", textTransform: "uppercase", color: active ? text : MUTED, transition: "all .15s" }
  }, label);
}

function EdgeBtn({ es, active, onClick }) {
  return h("button", {
    onClick, style: { display: "inline-flex", alignItems: "center", gap: 7, padding: "4px 10px",
      border: `1.5px solid ${active ? es.stroke : BORDER}`, background: active ? `${es.stroke}14` : WHITE,
      cursor: "pointer", fontFamily: "'Montserrat',sans-serif", fontSize: 9, fontWeight: 800,
      letterSpacing: "0.1em", textTransform: "uppercase", color: active ? es.stroke : MUTED, transition: "all .15s" }
  },
    h("svg", { width: 22, height: 10 },
      h("line", { x1: 0, y1: 5, x2: 22, y2: 5, stroke: es.stroke, strokeWidth: 2, strokeDasharray: es.dash === "none" ? undefined : es.dash }),
      h("polygon", { points: "18,2 22,5 18,8", fill: es.stroke })
    ),
    es.label
  );
}

function TypoBtn({ t, active, onClick }) {
  const ts = TYPO_STYLES[t];
  return h("button", {
    onClick, style: { display: "inline-flex", flexDirection: "column", padding: "5px 10px",
      border: `2px solid ${active ? ts.border : BORDER}`, background: active ? ts.bg : WHITE,
      cursor: "pointer", fontFamily: "'Montserrat',sans-serif", transition: "all .15s", textAlign: "left" }
  },
    h("span", { style: { fontSize: 9, fontWeight: 900, letterSpacing: "0.14em", color: active ? ts.text : MUTED, textTransform: "uppercase" } }, ts.label),
    h("span", { style: { fontSize: 8.5, color: active ? ts.text : "#ccc", fontWeight: 500, marginTop: 2 } }, ts.desc)
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [callout, setCallout] = useState(null);
  const [filter, setFilter] = useState("all");
  const [hoverNode, setHoverNode] = useState(null);
  const [hoverEdge, setHoverEdge] = useState(null);
  const [tab, setTab] = useState("map");
  const containerRef = useRef(null);
  const svgRef = useRef(null);

  const toggleFilter = (v) => setFilter(f => f === v ? "all" : v);
  const isEdgeFilter = Object.keys(EDGE_STYLES).includes(filter);

  const activeEdgeNodes = new Set();
  if (isEdgeFilter) {
    EDGES.forEach(e => { if (filter === e.state) { activeEdgeNodes.add(e.from); activeEdgeNodes.add(e.to); } });
  }

  const visibleNodes = new Set([
    ...NODES.filter(n =>
      filter === "all" || filter === n.state || filter === n.typo || filter === n.group
    ).map(n => n.id),
    ...activeEdgeNodes
  ]);

  const openNode = useCallback((node, ev) => {
    const rect = ev.currentTarget.getBoundingClientRect();
    const container = containerRef.current?.getBoundingClientRect();
    if (!container) return;
    setCallout({ title: node.label, sub: node.sub || "", state: node.state, typo: node.typo, ins: node.ins, pos: { x: rect.left - container.left + rect.width / 2, y: rect.top - container.top } });
  }, []);

  const openEdge = useCallback((edge, ev) => {
    const from = findNode(edge.from), to = findNode(edge.to);
    if (!from || !to || !svgRef.current || !containerRef.current) return;
    const svgR = svgRef.current.getBoundingClientRect();
    const conR = containerRef.current.getBoundingClientRect();
    const scaleX = svgR.width / 900, scaleY = svgR.height / 540;
    setCallout({
      title: `${from.label} → ${to.label}`, sub: edge.label,
      state: edge.state, typo: edge.typo, ins: edge.ins,
      pos: { x: svgR.left - conR.left + (from.x + to.x) / 2 * scaleX, y: svgR.top - conR.top + (from.y + to.y) / 2 * scaleY }
    });
  }, []);

  const LOCK_INS = [
    "Fixed long-term retail leases in premium mall locations",
    "Legacy POS hardware contracts with multi-year replacement cycles",
    "Traditional commission structures tied exclusively to in-store cash transactions"
  ];
  const HARD_CONSTRAINTS = [
    "Cannot reduce physical store footprint immediately due to lease penalties",
